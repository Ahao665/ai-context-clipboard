<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AI Context Clipboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow1)"/>
  <rect width="1280" height="400" fill="url(#glow2)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280"/>
    <path d="M160 0V400M320 0V400M480 0V400M640 0V400M800 0V400M960 0V400M1120 0V400"/>
  </g>

  <!-- clipboard glyph -->
  <g transform="translate(96 108)">
    <rect x="0" y="0" width="112" height="140" rx="16" fill="#0f1730" stroke="url(#accent)" stroke-width="2.5"/>
    <rect x="34" y="-14" width="44" height="28" rx="9" fill="url(#accent)"/>
    <g stroke="#8fa6d8" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M24 52H88"/>
      <path d="M24 76H74"/>
      <path d="M24 100H60"/>
    </g>
    <circle cx="92" cy="112" r="22" fill="#111a33" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M92 102v20M82 112h20" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="252" y="150" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#f2f6ff" letter-spacing="-1">
    AI Context Clipboard
  </text>
  <text x="254" y="196" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#9db2dd">
    Copy anything. Press <tspan fill="#8b5cf6" font-weight="700">Alt+Space</tspan>. Let AI handle it.
  </text>
  <rect x="254" y="222" width="132" height="4" rx="2" fill="url(#accent)"/>

  <!-- chips -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600">
    <g>
      <rect x="254" y="258" width="128" height="38" rx="19" fill="#16203c" stroke="#2b3a63"/>
      <text x="318" y="283" fill="#a8c0f0" text-anchor="middle">🦀 Tauri 2</text>
    </g>
    <g>
      <rect x="394" y="258" width="112" height="38" rx="19" fill="#16203c" stroke="#2b3a63"/>
      <text x="450" y="283" fill="#a8c0f0" text-anchor="middle">⚛️ React</text>
    </g>
    <g>
      <rect x="518" y="258" width="150" height="38" rx="19" fill="#16203c" stroke="#2b3a63"/>
      <text x="593" y="283" fill="#a8c0f0" text-anchor="middle">🗄️ SQLite FTS5</text>
    </g>
    <g>
      <rect x="680" y="258" width="176" height="38" rx="19" fill="#16203c" stroke="#2b3a63"/>
      <text x="768" y="283" fill="#a8c0f0" text-anchor="middle">🔒 100% 本地运行</text>
    </g>
  </g>

  <!-- installer size note -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <text x="254" y="336" font-size="16" fill="#6d82ad">
      安装包 ~3 MB · 内存占用远低于 Electron · 数据不出本机
    </text>
  </g>

  <!-- decorative lines -->
  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.35" filter="url(#soft)">
    <path d="M980 400 C 1080 300, 1180 260, 1280 200"/>
    <path d="M900 400 C 1010 320, 1140 300, 1280 280"/>
  </g>
</svg>
