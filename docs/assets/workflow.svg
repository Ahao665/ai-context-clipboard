<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="How AI Context Clipboard works">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1426"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b8cff"/>
    </marker>
  </defs>

  <rect width="1280" height="420" fill="url(#wbg)"/>

  <text x="640" y="52" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8efff">
    工作流程
  </text>
  <text x="640" y="80" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7f93bd">
    剪贴板监听 → 本地分类与存储 → 快捷面板检索 → 按需调用 AI
  </text>

  <!-- stage 1 -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <rect x="46" y="120" width="252" height="216" rx="18" fill="#141d35" stroke="#2a3a63" stroke-width="1.5"/>
    <circle cx="86" cy="160" r="20" fill="#1d2a4d" stroke="#5b8cff" stroke-width="1.5"/>
    <text x="86" y="167" text-anchor="middle" font-size="19" fill="#9db2dd">1</text>
    <text x="120" y="167" font-size="20" font-weight="700" fill="#dfe9ff">复制即捕获</text>
    <g font-size="15" fill="#8ea3cc">
      <text x="72" y="214">Ctrl+C 任意内容</text>
      <text x="72" y="242">Win32 剪贴板监听（300 ms）</text>
      <text x="72" y="270">SHA256 指纹去重</text>
      <text x="72" y="298">内容类型自动识别</text>
    </g>
  </g>

  <path d="M310 228H360" stroke="url(#flow)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- stage 2 -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <rect x="374" y="120" width="252" height="216" rx="18" fill="#141d35" stroke="#2a3a63" stroke-width="1.5"/>
    <circle cx="414" cy="160" r="20" fill="#1d2a4d" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="414" y="167" text-anchor="middle" font-size="19" fill="#9db2dd">2</text>
    <text x="448" y="167" font-size="20" font-weight="700" fill="#dfe9ff">本地落库</text>
    <g font-size="15" fill="#8ea3cc">
      <text x="400" y="214">SQLite 单文件存储</text>
      <text x="400" y="242">FTS5 trigram 索引</text>
      <text x="400" y="270">中英文子串秒搜</text>
      <text x="400" y="298">敏感内容可选跳过</text>
    </g>
  </g>

  <path d="M638 228H688" stroke="url(#flow)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- stage 3 -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <rect x="702" y="120" width="252" height="216" rx="18" fill="#141d35" stroke="#2a3a63" stroke-width="1.5"/>
    <circle cx="742" cy="160" r="20" fill="#1d2a4d" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="742" y="167" text-anchor="middle" font-size="19" fill="#9db2dd">3</text>
    <text x="776" y="167" font-size="20" font-weight="700" fill="#dfe9ff">一键呼出</text>
    <g font-size="15" fill="#8ea3cc">
      <text x="728" y="214">Alt+Space 全局快捷键</text>
      <text x="728" y="242">全历史搜索 + 类型筛选</text>
      <text x="728" y="270">置顶收藏常用片段</text>
      <text x="728" y="298">Enter 直接粘贴回剪贴板</text>
    </g>
  </g>

  <path d="M966 228H1016" stroke="url(#flow)" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- stage 4 -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <rect x="1030" y="120" width="204" height="216" rx="18" fill="#141d35" stroke="#2a3a63" stroke-width="1.5"/>
    <circle cx="1070" cy="160" r="20" fill="#1d2a4d" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1070" y="167" text-anchor="middle" font-size="19" fill="#9db2dd">4</text>
    <text x="1104" y="167" font-size="20" font-weight="700" fill="#dfe9ff">按需 AI</text>
    <g font-size="15" fill="#8ea3cc">
      <text x="1056" y="214">总结 / 翻译 / 润色</text>
      <text x="1056" y="242">回复 / 解释</text>
      <text x="1056" y="270">调用前展示原文</text>
      <text x="1056" y="298">结果留在面板内</text>
    </g>
  </g>

  <!-- privacy footer -->
  <g font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif">
    <rect x="46" y="360" width="1188" height="42" rx="12" fill="#101a30" stroke="#24314f"/>
    <text x="640" y="387" text-anchor="middle" font-size="15" fill="#8ea3cc">
      🔒 第 1–3 步完全离线 · 只有你主动点击 AI 操作时才会发起网络请求，且发送内容会先展示给你确认
    </text>
  </g>
</svg>
