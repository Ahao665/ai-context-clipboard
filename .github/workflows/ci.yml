name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install
      - run: pnpm typecheck
      - name: TypeScript tests
        run: pnpm test

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests (headless-safe modules)
        working-directory: src-tauri
        # The clipboard round-trip tests in `clipboard::writer` drive the real
        # Windows clipboard, which CI runners do not provide — they either block
        # or fail on `OpenClipboard`. Everything listed here is pure data logic:
        # `commands::autostart` only exercises the UTF-16/command-line helpers and
        # never touches the registry.
        # Filters go after `--` because cargo itself accepts only one TESTNAME.
        # NOTE: the value MUST be quoted — a trailing "::" in a plain scalar is
        # parsed as a mapping key indicator and makes the whole file invalid.
        # `clipboard::writer` is deliberately left out: its round-trip tests need
        # a real desktop session and hang (rather than fail) without one.
        # `clipboard::image` is pure byte manipulation, so it is safe here.
        run: "cargo test --lib -- storage:: clipboard::watcher:: clipboard::image:: shortcut:: commands::"

