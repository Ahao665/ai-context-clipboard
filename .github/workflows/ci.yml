name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install
      - run: pnpm typecheck
      - name: TypeScript tests
        run: pnpm test

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests (headless-safe modules)
        working-directory: src-tauri
        # Run everything except the tests that drive the real Windows clipboard,
        # which CI runners do not provide — those block on `OpenClipboard`
        # instead of failing, so a scoped run is the only way to get a verdict.
        #
        # `--skip` rather than a list of modules to include: an include list has
        # to be updated whenever a module is added, and a broad prefix silently
        # re-includes what you meant to leave out (naming `clipboard::` to pick
        # up a new submodule also pulls `clipboard::writer` back in).
        #
        # Filters go after `--` because cargo itself accepts only one TESTNAME.
        # NOTE: the value MUST be quoted — a trailing "::" in a plain scalar is
        # parsed as a mapping key indicator and makes the whole file invalid.
        run: "cargo test --lib -- --skip clipboard::writer:: --skip clipboard::watcher::desktop::"

